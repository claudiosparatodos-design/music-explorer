<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Music Explorer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="header">
    <h1 class="title">Music Explorer</h1>
    <p class="subtitle">Search an artist and browse their songs grouped by album.</p>

    <!-- A form gives us Enter-to-submit for free -->
    <form class="search" id="search-form" autocomplete="off">
      <input
        class="search__input"
        id="search-input"
        type="search"
        name="term"
        placeholder="e.g. Daft Punk, Radiohead, Bad Bunny…"
        aria-label="Artist name"
        required
      />
      <button class="search__button" type="submit" id="search-button">Search</button>
    </form>
  </header>

  <main class="main">
    <!-- Single status region reused for loading / empty / error messages.
         aria-live so screen readers announce state changes. -->
    <div class="status" id="status" role="status" aria-live="polite"></div>

    <!-- Summary line shown above the results (album/track counts) -->
    <p class="results-summary" id="results-summary" hidden></p>

    <!-- Album cards are rendered here -->
    <section class="albums" id="albums" aria-label="Albums"></section>
  </main>

  <footer class="footer">
    <p>Data from the public <a href="https://performance-partners.apple.com/search-api" target="_blank" rel="noopener noreferrer">iTunes Search API</a>.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
