<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mac Miller — Music Explorer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="header">
    <p class="eyebrow">Artist profile</p>
    <h1 class="title">Mac Miller</h1>
    <p class="subtitle">
      Curious statistics pulled from his catalogue on the iTunes Store.
    </p>
  </header>

  <main class="main">
    <!-- Status region reused for loading and error messages.
         aria-live so screen readers announce state changes. -->
    <div class="status" id="status" role="status" aria-live="polite"></div>

    <!-- Only shown after a search succeeds, so a failure never reveals a half-built page -->
    <div id="content" hidden>

      <!-- Headline numbers: the four figures that frame everything below -->
      <section class="hero" id="hero" aria-label="Headline numbers"></section>

      <section class="section">
        <h2 class="section__title">Curious facts</h2>
        <p class="section__note">Everything here is computed from the songs listed below — not from chart or streaming data.</p>
        <div class="facts" id="facts"></div>
      </section>

      <section class="section">
        <h2 class="section__title">Songs released per year</h2>
        <p class="section__note" id="chart-note"></p>
        <!-- Bar chart is built in JS; the table below carries the same numbers for screen readers -->
        <div class="chart" id="chart"></div>
        <table class="visually-hidden" id="chart-table"></table>
      </section>

      <section class="section">
        <h2 class="section__title">Albums</h2>
        <p class="section__note" id="albums-summary"></p>
        <div class="albums" id="albums"></div>
        <div class="show-more">
          <button class="button button--ghost" type="button" id="show-more-button" hidden></button>
        </div>
      </section>
    </div>

    <!-- Lets the user recover from a network error without reloading the page -->
    <div class="retry">
      <button class="button" type="button" id="retry-button" hidden>Try again</button>
    </div>
  </main>

  <footer class="footer">
    <p>Data from the public <a href="https://performance-partners.apple.com/search-api" target="_blank" rel="noopener noreferrer">iTunes Search API</a>.</p>
  </footer>

  <script src="script.js"></script>

  <!--
    Missing-file guard. index.html needs style.css and script.js sitting next to
    it. Opening it straight from inside a .zip gives it neither — the archive
    extracts one file to a temp folder — and the result is a bare, unstyled page
    with no explanation. This inline check runs last and says what went wrong.
  -->
  <script>
    (function () {
      var cssLoaded = !!getComputedStyle(document.documentElement)
        .getPropertyValue('--radius').trim();
      var jsLoaded = window.MUSIC_EXPLORER_LOADED === true;
      if (cssLoaded && jsLoaded) return;

      var missing = [];
      if (!cssLoaded) missing.push('style.css');
      if (!jsLoaded) missing.push('script.js');

      // Styled inline: the stylesheet is exactly what might be missing here.
      var box = document.createElement('div');
      box.setAttribute('style', [
        'max-width:560px', 'margin:32px auto', 'padding:20px 22px',
        'border:1px solid #c62828', 'border-radius:12px', 'background:#fff5f5',
        'color:#1a1d23', 'text-align:left', 'line-height:1.55',
        'font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif',
      ].join(';'));

      var title = document.createElement('p');
      title.setAttribute('style', 'margin:0 0 8px;font-weight:700;color:#c62828');
      title.textContent = 'This page could not load ' + missing.join(' and ') + '.';

      var body = document.createElement('p');
      body.setAttribute('style', 'margin:0 0 8px');
      body.textContent =
        'index.html only works with style.css and script.js in the same folder. '
        + 'If you opened it from inside a .zip, the archive handed the browser this '
        + 'one file on its own and left the others behind.';

      var fix = document.createElement('p');
      fix.setAttribute('style', 'margin:0');
      fix.textContent =
        'Fix: extract the whole .zip to a real folder first (right-click → Extract All), '
        + 'then open index.html from the extracted folder.';

      box.appendChild(title);
      box.appendChild(body);
      box.appendChild(fix);
      document.body.insertBefore(box, document.body.firstChild);
    }());
  </script>
</body>
</html>
